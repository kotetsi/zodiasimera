# Χτίζει το site κάθε βράδυ λίγο μετά τα μεσάνυχτα ώρας Ελλάδας και το δημοσιεύει στο GitHub Pages.
name: Build and deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 22 * * *' # 00:07 χειμερινή ώρα Ελλάδας / 01:07 θερινή
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
